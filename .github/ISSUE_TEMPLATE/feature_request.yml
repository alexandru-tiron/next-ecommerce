name: Feature request
description: Suggest something the store should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](../blob/main/docs/ROADMAP.md) first, since your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Who needs this (shoppers, store owners, developers) and why?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
