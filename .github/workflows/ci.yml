name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The Firebase/Algolia config is public (it ships in the browser bundle), so it's read from repository variables.
    # Without them (forks, new clones) placeholders keep the build check working; the build never contacts these services.
    env:
      NEXT_PUBLIC_STORE_NAME: ${{ vars.NEXT_PUBLIC_STORE_NAME || 'CI store' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ci.example.com' }}
      NEXT_PUBLIC_APIKEY: ${{ vars.NEXT_PUBLIC_APIKEY || 'ci-placeholder' }}
      NEXT_PUBLIC_AUTHDOMAIN: ${{ vars.NEXT_PUBLIC_AUTHDOMAIN || 'demo-ci.firebaseapp.com' }}
      NEXT_PUBLIC_PROJECTID: ${{ vars.NEXT_PUBLIC_PROJECTID || 'demo-ci' }}
      NEXT_PUBLIC_STORAGEBUCKET: ${{ vars.NEXT_PUBLIC_STORAGEBUCKET || 'demo-ci.appspot.com' }}
      NEXT_PUBLIC_MESSAGINGSENDERID: ${{ vars.NEXT_PUBLIC_MESSAGINGSENDERID || '0' }}
      NEXT_PUBLIC_APPID: ${{ vars.NEXT_PUBLIC_APPID || 'ci-placeholder' }}
      NEXT_PUBLIC_MEASUREMENTID: ${{ vars.NEXT_PUBLIC_MEASUREMENTID }}
      NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ vars.NEXT_PUBLIC_ALGOLIA_APP_ID || 'ci-placeholder' }}
      NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ vars.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY || 'ci-placeholder' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on known high or critical vulnerabilities in production dependencies
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      # The shared rules in packages/core take their dependencies from the root package.json
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # Type-checks, bundles (with packages/core) and runs the unit tests
      - run: npm test

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The Firestore and Storage emulators run on Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm ci
      # Security rules tests against the emulators (the script runs Firebase CLI 14 through npx)
      - run: npm run test:rules

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans the full git history for committed keys and passwords
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
